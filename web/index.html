<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Micro-Crypt Engine</title>
    <script src="wasm_exec.js"></script>
    <script>
        const go = new Go();
        let currentMode = "encrypt"; 

        WebAssembly.instantiateStreaming(fetch("crypto.wasm"), go.importObject).then((result) => {
            go.run(result.instance);
        });

        function processCrypto() {
            const input = document.getElementById("messageInput").value;
            const key = document.getElementById("secretKey").value;
            
            if (typeof encryptTextNative === "function") {
                document.getElementById("outputDisplay").innerText = encryptTextNative(input, key, currentMode);
            }
        }

        function toggleMode(mode) {
            currentMode = mode;
            
            document.getElementById("btnEncrypt").classList.toggle("active", mode === "encrypt");
            document.getElementById("btnDecrypt").classList.toggle("active", mode === "decrypt");
            document.getElementById("inputLabel").innerText = mode === "encrypt" ? "2. Plaintext Message" : "2. Hex Ciphertext to Decrypt";
            document.getElementById("outputLabel").innerText = mode === "encrypt" ? "Encrypted Hex output" : "Decrypted Text Output";
            document.getElementById("outputDisplay").style.color = mode === "encrypt" ? "#ff0055" : "#00ff66";
            
            document.getElementById("messageInput").value = "";
            document.getElementById("outputDisplay").innerText = "";
            processCrypto();
        }

        function toggleKeyVisibility() {
            const keyInput = document.getElementById("secretKey");
            const btn = document.getElementById("toggleKeyBtn");
            
            if (keyInput.type === "password") {
                keyInput.type = "text";
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
            } else {
                keyInput.type = "password";
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
            }
        }
    </script>
    <style>
        body { 
            background: #000000; 
            color: #ffffff; 
            font-family: monospace; 
            padding: 60px;
            max-width: 600px;
            margin: 0 auto;
        }
        h2 { 
            border-bottom: 1px dashed #222222; 
            padding-bottom: 10px; 
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 30px;
        }
        .mode-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .mode-btn {
            background: #020202;
            color: #555555;
            border: 1px solid #1a1a1a;
            padding: 10px 20px;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
        }
        .mode-btn.active {
            color: #ffffff;
            border-color: #ffffff;
            background: #0a0a0a;
        }
        .field-group { margin-bottom: 25px; }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555555;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }
        input { 
            background: #050505; 
            color: #ffffff; 
            border: 1px solid #1a1a1a; 
            padding: 14px; 
            width: 100%; 
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: #333333; }
        #secretKey {
            padding-right: 45px;
        }
        .toggle-password-btn {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            cursor: pointer;
            color: #555555;
            padding: 0;
            display: flex;
            align-items: center;
            outline: none;
        }
        .toggle-password-btn:hover {
            color: #ffffff;
        }
        .output-box {
            margin-top: 40px;
            background: #020202;
            border: 1px dashed #1a1a1a;
            padding: 20px;
        }
        #outputDisplay { 
            color: #ff0055; 
            word-break: break-all; 
            font-size: 1.1rem;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <h2>[ MICRO-CRYPT ENGINE ]</h2>

    <label>Select Operation Mode</label>
    <div class="mode-container">
        <button id="btnEncrypt" class="mode-btn active" onclick="toggleMode('encrypt')">Encrypt Mode</button>
        <button id="btnDecrypt" class="mode-btn" onclick="toggleMode('decrypt')">Decrypt Mode</button>
    </div>
    
    <div class="field-group">
        <label>1. Encryption Passphrase (Key)</label>
        <div class="input-wrapper">
            <input type="password" id="secretKey" oninput="processCrypto()" placeholder="Enter verification key...">
            <button type="button" id="toggleKeyBtn" class="toggle-password-btn" onclick="toggleKeyVisibility()">
                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
        </div>
    </div>

    <div class="field-group">
        <label id="inputLabel">2. Plaintext Message</label>
        <input type="text" id="messageInput" oninput="processCrypto()" placeholder="Type data here...">
    </div>

    <div class="output-box">
        <label id="outputLabel">Encrypted Hex output</label>
        <div id="outputDisplay"></div>
    </div>

</body>
</html>
